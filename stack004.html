<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>层叠与继承+盒模型</title>
        <link rel="stylesheet" href="./stack004.css">
    </head>
    <body>
        <!-- div.container回车-->
         <div class="container">
            <h2 class="container-title">层叠与继承+盒模型</h2>
            <div class="card-wrap" id="card-wrap">
                <div class="card">
                    <img src="./img/2.jpg" alt="">
                    <h3>盒模型</h3>
                    <p class="card-desc">盒模型是CSS中一个重要的概念，它定义了元素的布局方式。每个元素都可以看作是一个矩形的盒子，这个盒子由内容（content）、内边距（padding）、边框（border）和外边距（margin）组成。</p>
                </div>
            </div>
         </div>
         <!--ol>li*10回车-->
         <h2>通关游戏答案</h2>
         <ol>
         <li>plate</li>
         <li>bento</li>
         <li>#fancy</li>
         <li>plate apple</li>
         <li>#fancy pickle</li>
         <li>.small</li>
         <li>orange.small</li>
         <li>bento orange.small</li>
         <li>plate,bento</li>
         <li>*</li>
         <li>plate * </li>
         </ol>
    </body>
</html>
